<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Why Tidy — Tidy</title>
  <link rel="canonical" href="https://tidy.example/">
  <meta name="description" content="Why teams pick Tidy.">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 16px; }
    /* resp.safari-ios: full screen height with 100vh, the button at its very bottom */
    .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 24px 24px; box-sizing: border-box; background: #f3f0ea; }
    .hero a { display: inline-block; padding: 14px 20px; background: #222; color: #fff; text-decoration: none; }
    /* resp.text-size: a whole paragraph at 10px */
    .fine { font-size: 10px; padding: 0 24px; }
    /* resp.tablet: the menu items are pulled over each other between 768 and 1100px */
    nav { display: flex; gap: 8px; padding: 12px 24px; }
    @media (min-width: 768px) and (max-width: 1100px) { nav a + a { margin-left: -60px; } }
    /* resp.fixed-overlap: a floating chat button over the footer link */
    .chat { position: fixed; right: 16px; bottom: 16px; width: 56px; height: 56px; border-radius: 50%; background: #25d366; border: 0; }
    footer { text-align: right; padding: 24px; }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Notes your team actually reads</h1>
    <a href="/login.html">Start free</a>
  </section>
  <nav><a href="/">Home</a><a href="/contact.html">Contact</a><a href="/app.html">App</a></nav>
  <p>Tidy keeps your team's notes in one place.</p>
  <p class="fine">Tidy stores your notes on servers in the EU. Plans renew every month until you cancel. Prices include VAT where it applies, and you can export your notes at any time from the settings page.</p>
  <button class="chat" aria-label="Chat with us"></button>
  <footer><a href="/terms.html">Terms</a></footer>
</body>
</html>
