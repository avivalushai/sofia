<!doctype html>
<html lang="he" dir="rtl">
<head>

  <title>פתקים חכמים · בית</title>

      <h2>מה אומרים עלינו</h2>
      <ul id="testimonials"></ul>

    <section>
      <h2>שאל את העוזר</h2>
      <textarea id="question"></textarea>
      <button id="ask" type="button">שאל</button>
      <div id="answer"></div>
    </section>
  </main>
  <!-- privacy.licenses — a stock photo saved from the agency's site -->
  <img src="/images/shutterstock_1234567.jpg" alt="אישה כותבת במחברת" width="600" height="400">
  <!-- cost.per-load — a new AI tip on every visit -->
  <p id="tip"></p>
  <footer><a href="/privacy.html">מדיניות פרטיות</a></footer>
