<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tidy — team notes</title>
  <meta name="description" content="Shared notes for small teams.">
  <style>
      input:not([type=hidden]), textarea { border: 1px solid #bbb; background: #fff; border-radius: 4px; min-height: 40px; padding: 0 12px; box-sizing: border-box; }
      button { cursor: pointer; }
      button:hover { filter: brightness(0.92); }
  </style>
</head>
<body>
  <main>
    <h1>Tidy</h1>
    
    <img src="/hero.svg" alt="Tidy on a laptop" width="600" height="400">
    <form action="/api/subscribe" method="post">
      <label>Email <input type="email" name="email" autocomplete="email"></label>
      <input type="text" name="website" tabindex="-1" autocomplete="off" hidden aria-hidden="true">
      <button type="submit">Get updates</button>
    </form>
    <p><a href="/login.html">Log in</a> · <a href="/mobile.html">Why Tidy</a> · <a href="/pricing.html">Pricing</a></p>
  </main>
</body>
</html>
