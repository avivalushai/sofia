<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Tidy</title>
  <link rel="canonical" href="https://tidy.example/login.html">
  <meta name="description" content="Log in to Tidy to see your team's notes, decisions and checklists, on any device, online or offline.">
  <style>
      input:not([type=hidden]), textarea { border: 1px solid #bbb; background: #fff; border-radius: 4px; min-height: 40px; padding: 0 12px; box-sizing: border-box; }
      button { cursor: pointer; }
      button:hover { filter: brightness(0.92); }
  </style>
</head>
<body>
  <main>
    <h1>Log in</h1>
    <form action="/api/session" method="post">
      <label>Email <input type="email" name="email" autocomplete="email"></label>
      <label>Password <input type="password" name="password" autocomplete="current-password"></label>
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
