<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Tidy</title>
  <meta name="description" content="Talk to the Tidy team.">
</head>
<body>
  <main>
    <h1>Contact us</h1>
    <form action="/api/contact" method="post">
      <label>Full name <input type="text" name="name" autocomplete="name" enterkeyhint="next"></label>
      <label>Email <input type="email" name="email" autocomplete="email" enterkeyhint="next"></label>
      <label>Phone <input type="tel" name="phone" autocomplete="tel" enterkeyhint="next"></label>
      <label>Message <textarea name="message" enterkeyhint="send"></textarea></label>
      <input type="text" name="website" tabindex="-1" autocomplete="off" hidden aria-hidden="true">
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
