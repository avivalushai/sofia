<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Tidy</title>
  <link rel="canonical" href="https://tidy.example/contact.html">
  <meta name="description" content="Questions about Tidy? Send the team a message and we will reply within one working day, usually much sooner.">
  <style>
      input:not([type=hidden]), textarea { border: 1px solid #bbb; background: #fff; border-radius: 4px; min-height: 40px; padding: 0 12px; box-sizing: border-box; }
      button { cursor: pointer; }
      button:hover { filter: brightness(0.92); }
  </style>
</head>
<body>
  <main>
    <h1>Contact us</h1>
    <form action="/api/contact" method="post">
      <label>Full name <input type="text" name="name" autocomplete="name" enterkeyhint="next"></label>
      <label>Email <input type="email" name="email" autocomplete="email" enterkeyhint="next"></label>
      <label>Phone <input type="tel" name="phone" autocomplete="tel" enterkeyhint="next"></label>
      <label>Message <textarea name="message" enterkeyhint="send"></textarea></label>
      <input type="text" name="website" tabindex="-1" autocomplete="off" hidden aria-hidden="true">
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
