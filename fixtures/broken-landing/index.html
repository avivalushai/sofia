<!doctype html>
<html dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שיעורי פילאטיס</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <a href="index.html" class="logo">פילאטיס עם נועה</a>
    <nav>
      <a href="pricing.html">מחירים</a>
      <a href="about.html">אודות</a>
      <a href="#contact">צור קשר</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>שיעורי פילאטיס בקבוצות קטנות</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      <button class="cta" type="button">לשיעור ניסיון</button>
    </section>

    <section class="team">
      <h2>הצוות</h2>
      <img src="assets/team.jpg" alt="">
    </section>

    <section class="pricing">
      <div class="card"><h3>שיעור בודד</h3><p>80 ₪</p></div>
      <div class="card"><h3>כרטיסייה 10</h3><p>700 ₪</p></div>
      <div class="card"><h3>מנוי חודשי</h3><p>390 ₪</p></div>
    </section>

    <section id="contact">
      <h2>להרשמה</h2>
      <form id="signup">
        <label for="name">שם</label>
        <input id="name" name="name">
        <input id="email" name="email" placeholder="מייל">
        <button type="submit">שליחה</button>
      </form>
      <p id="msg" hidden>תודה! נחזור אליך בקרוב</p>
    </section>
  </main>

  <footer>© 2024 פילאטיס עם נועה</footer>
  <script src="assets/app.js"></script>
</body>
</html>
